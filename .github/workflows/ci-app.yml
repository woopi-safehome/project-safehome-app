name: CI (App)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  verify:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # pubspec.lock 이 이 SDK 가 고정하는 버전들을 담고 있다. 함께 올린다.
          flutter-version: '3.32.5'
          channel: stable
          cache: true

      # 로컬과 같은 파일을 실행한다 — 의존성, 코드 생성, 분석, 테스트.
      # 명령이 다르면 로컬 통과가 CI 통과를 뜻하지 않는다.
      - name: Verify
        run: bash scripts/verify.sh
